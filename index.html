<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mark Ratsko</title>
  <style>
    :root { --bg:#0e0f12; --fg:#eceae6; --muted:#9a978f; --accent:#c9a45c; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; line-height:1.6; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px; }
    main { max-width:640px; width:100%; }
    h1 { font-size:clamp(2rem,6vw,3rem); letter-spacing:-0.02em; }
    .tag { color:var(--accent); font-size:.85rem; letter-spacing:.12em; text-transform:uppercase; margin-bottom:12px; }
    p { color:var(--muted); margin-top:16px; font-size:1.05rem; }
    nav { margin-top:32px; display:flex; gap:20px; flex-wrap:wrap; }
    a { color:var(--fg); text-decoration:none; border-bottom:1px solid var(--accent); padding-bottom:2px; }
    a:hover { color:var(--accent); }
  </style>
</head>
<body>
  <main>
    <div class="tag">Hello, I'm</div>
    <h1>Mark Ratsko</h1>
    <p>Finance professional, founder, and builder based in Washington. Background in private equity, venture capital, and investment analysis — now building products and helping businesses grow.</p>
    <nav>
      <a href="https://github.com/Markiscool2">GitHub</a>
      <a href="mailto:iammarkratsko@gmail.com">Email</a>
    </nav>
  </main>
</body>
</html>
